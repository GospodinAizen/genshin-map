name: Python tests

on:
  push:
    branches: [main, architecture-v2, fix/main-startup-and-overlay]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run database tests
        run: PYTHONPATH=собственный python -m unittest discover -s tests -v
